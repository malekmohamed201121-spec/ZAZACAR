<style>
.music-btn{position:fixed;bottom:90px;right:20px;z-index:1000;background:#FFD700;color:#000;border:none;border-radius:50%;width:50px;height:50px;font-size:22px;cursor:pointer;box-shadow:0 0 15px rgba(255,215,0,0.5);transition:0.3s}
.music-btn.off{opacity:0.5;transform:scale(0.9)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}body{background:#000;color:#fff;padding-bottom:80px}html{scroll-behavior:smooth}
.header{width:100%;height:450px;background:url('https://postimg.cc') center/cover fixed no-repeat;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;animation:zoomBg 20s infinite alternate}
@keyframes zoomBg{from{background-size:100%}to{background-size:110%}}
.header::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#000,rgba(0,0,0,0.3))}
.header h1{position:relative;z-index:2;font-size:55px;color:#FFD700;letter-spacing:3px;font-weight:900;text-shadow:0 0 20px rgba(255,215,0,0.5)}
.header p{position:relative;z-index:2;font-size:16px;color:#ccc;margin-top:8px}
.tools{background:#0a0a0a;padding:15px;position:sticky;top:0;z-index:100;backdrop-filter:blur(5px)}
.search-box{max-width:500px;margin:0 auto 10px;position:relative}
.search-box input{width:100%;padding:10px 15px;border-radius:25px;border:1px solid #333;background:#111;color:#fff;font-size:14px;outline:none}
.search-box input:focus{border-color:#FFD700}
.filters{text-align:center;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.filters button{background:#000;color:#FFD700;border:1px solid #FFD700;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;transition:0.3s}
.filters button:hover,.filters button.active{background:#FFD700;color:#000;transform:translateY(-2px)}
.main-content{display:flex;gap:20px;padding:20px 15px;max-width:1400px;margin:auto}
.contact-box{width:250px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;position:sticky;top:120px;height:fit-content}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;padding:12px 8px;border-radius:6px;font-size:13px;transition:0.3s}
.btn:hover{transform:translateX(-3px)}
.btn-facetime{background:#00C853;color:#fff}
.btn-snap{background:#FFEB3B;color:#000}
.btn-whatsapp{background:#00C853;color:#fff}
.btn-call{background:#FFD700;color:#000}
.gallery{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.car-card{background:#111;border-radius:10px;overflow:hidden;transition:all 0.3s ease;border:1px solid #222;display:none;cursor:pointer;position:relative}
.car-card.show{display:block;animation:fadeInUp 0.5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.car-card:hover{transform:translateY(-8px);border-color:#FFD700;box-shadow:0 10px 20px rgba(255,215,0,0.1)}
.badge{position:absolute;top:10px;right:10px;background:#FFD700;color:#000;padding:4px 10px;font-size:10px;font-weight:900;border-radius:15px;z-index:3}
.badge.new{background:#00C853;color:#fff}
.badge.video{background:#FF0000;color:#fff}
.badge.popular{background:#FFD700;color:#000;right:80px}
.car-card img,.car-card iframe{width:100%;height:220px;object-fit:cover;background:#000;display:block;transition:0.4s;border:0}
.car-card:hover img{transform:scale(1.05)}
.video-thumb{position:relative;cursor:pointer}
.video-thumb::after{content:'▶';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;color:#fff;background:rgba(0,0,0,0.6);width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:0.3s}
.video-thumb:hover::after{background:rgba(255,0,0,0.8);transform:translate(-50%,-50%) scale(1.1)}
.car-info{padding:15px;text-align:center;position:relative}
.car-info h3{color:#FFD700;font-size:17px;margin-bottom:5px}
.tag{font-size:11px;padding:4px 12px;border-radius:15px;display:inline-block;background:rgba(0,200,83,0.2);color:#00C853;border:1px solid #00C853}
.tag.popular{background:rgba(255,215,0,0.2);color:#FFD700;border:1px solid #FFD700}
.btn-car{display:block;background:#FFD700;color:#000;padding:10px;border-radius:5px;text-decoration:none;font-weight:700;font-size:13px;margin-top:10px;transition:0.3s;cursor:pointer;border:none;width:100%}
.btn-car:hover{background:#fff;transform:scale(1.02)}
.contact-menu{display:none;position:absolute;bottom:50px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #FFD700;border-radius:8px;padding:8px;width:90%;z-index:10;box-shadow:0 5px 15px rgba(0,0,0,0.5)}
.contact-menu.show{display:flex;flex-direction:column;gap:6px;animation:fadeInUp 0.3s ease}
</style>
